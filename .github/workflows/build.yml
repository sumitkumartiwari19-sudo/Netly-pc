name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compute app version
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $v = "${{ github.ref_name }}".TrimStart('v') -replace '-.*$', ''
          } else {
            $v = "0.0.1"
          }
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Version: $v"

      - name: Download yt-dlp (checksum verified)
        run: |
          $dir = "app/resources/windows-x64"
          New-Item -ItemType Directory -Force $dir | Out-Null
          $base = "https://github.com/yt-dlp/yt-dlp/releases/latest/download"
          Invoke-WebRequest "$base/yt-dlp.exe" -OutFile "$dir/yt-dlp.exe"
          Invoke-WebRequest "$base/SHA2-256SUMS" -OutFile "sums.txt"
          $line = Get-Content sums.txt | Where-Object { $_ -match '\s\*?yt-dlp\.exe$' } | Select-Object -First 1
          $expected = ($line -split '\s+')[0].ToLower()
          $actual = (Get-FileHash "$dir/yt-dlp.exe" -Algorithm SHA256).Hash.ToLower()
          if ($expected -ne $actual) { throw "yt-dlp checksum mismatch" }
          Write-Host "yt-dlp OK"

      - name: Download FFmpeg (LGPL build)
        run: |
          $dir = "app/resources/windows-x64"
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip"
          Invoke-WebRequest $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp
          $exe = Get-ChildItem ffmpeg-tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName "$dir/ffmpeg.exe"
          Write-Host "FFmpeg OK"

      - name: Run tests
        run: gradle test --no-daemon --stacktrace

      - name: Build installer (EXE, MSI) and portable app
        run: gradle packageExe packageMsi createDistributable "-PappVersion=$env:APP_VERSION" --no-daemon --stacktrace

      - name: Collect release files
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item app/build/compose/binaries/main/exe/*.exe dist/
          Copy-Item app/build/compose/binaries/main/msi/*.msi dist/
          Compress-Archive -Path app/build/compose/binaries/main/app/Netly -DestinationPath "dist/Netly-$env:APP_VERSION-portable.zip"
          Get-ChildItem dist -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt
          Get-ChildItem dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: netly-windows-${{ env.APP_VERSION }}
          path: dist/*
          retention-days: 14

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
